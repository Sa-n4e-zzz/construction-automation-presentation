<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Рабочая концепция автоматизации процессов строительной компании: PDF-презентация из 7 страниц.">
  <title>Документы и данные стройки под контролем</title>
  <style>
    :root {
      --bg: #F5F3EE;
      --text: #142A38;
      --accent: #C68148;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 2rem 1.25rem 3.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    .wrap { max-width: 48rem; margin: 0 auto; }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.75rem;
      line-height: 1.25;
    }
    .lead { margin: 0 0 1.75rem; max-width: 38rem; }
    .actions { margin: 0 0 0.75rem; }
    a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    a.primary {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border: 2px solid var(--text);
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
      line-height: 1.3;
    }
    a.primary:hover { text-decoration: underline; }
    .meta { margin: 0 0 2.25rem; font-size: 0.9375rem; }
    hr {
      margin: 0 0 2rem;
      border: 0;
      border-top: 1px solid rgba(20, 42, 56, 0.25);
    }
    h2 { margin: 0 0 0.75rem; font-size: 1.125rem; }
    .preview img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(20, 42, 56, 0.25);
    }
    .preview { margin: 0; }
    .preview a { display: block; }
    .preview figcaption { margin-top: 0.65rem; font-size: 0.875rem; }
    @media (max-width: 40em) {
      body { padding: 1.5rem 1rem 2.5rem; font-size: 16px; }
      h1 { font-size: 1.5rem; }
      a.primary { display: block; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Документы и данные стройки под контролем</h1>
      <p class="lead">Рабочая концепция автоматизации процессов строительной компании: от разбора одного вида работ до пилота реестра исполнительных документов.</p>
    </header>
    <main>
      <p class="actions"><a class="primary" href="presentation.pdf">Открыть или скачать PDF</a></p>
      <p class="meta">PDF, 7 страниц.</p>
      <hr>
      <section aria-labelledby="preview-heading">
        <h2 id="preview-heading">Обложка презентации</h2>
        <figure class="preview">
          <a href="presentation.pdf">
            <img src="preview.jpg" alt="Обложка презентации «Документы и данные стройки под контролем», PDF, 7 страниц" width="1200" height="675">
          </a>
          <figcaption>Нажмите на обложку, чтобы открыть PDF.</figcaption>
        </figure>
      </section>
    </main>
  </div>
</body>
</html>
